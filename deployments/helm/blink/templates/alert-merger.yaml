{{- $stage := include "blink.sharedStage" (dict "root" . "stage" "merger") | fromYaml }}
{{- $sharedStageOverrides := .Values.sharedStageOverrides | default dict }}
{{- $overrides := get $sharedStageOverrides "merger" | default dict }}
{{- $config := include "blink.sharedStageConfig" (dict "root" . "overrides" $overrides) | fromYaml }}
{{- $workload := required "global.sharedStages.merger.workload is required" $stage.workload }}
---
# alert-merger groups related alerts by merge_by_keys + time window before tuning.
# Scaling: the executor writes to merger-topic using MergePartitionKey as the Kafka
# message key (rule_name|merge_by_values), so Kafka routes all alerts that belong to
# the same merge group to the same partition → same replica.  Set replicas ≤ the
# partition count of the merger-topic to avoid idle replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $workload }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $workload }}
    {{- include "blink.labels" . | nindent 4 }}
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels:
      app: {{ $workload }}
  template:
    metadata:
      labels:
        app: {{ $workload }}
    spec:
      containers:
        - name: alert-merger
          image: {{ include "blink.image" (dict "registry" .Values.image.registry "name" "blink-alert-merger" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/blink-alert-merger"]
          envFrom:
            {{- include "blink.envFrom" . | nindent 12 }}
          env:
            - name: APP_NAME
              value: "alert-merger"
            - name: MERGER_MAX_GROUPS
              value: {{ $config.maxGroups | quote }}
          ports:
            - name: http
              containerPort: 8080
          {{- include "blink.probes" . | nindent 10 }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $workload }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $workload }}
    {{- include "blink.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ $workload }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
