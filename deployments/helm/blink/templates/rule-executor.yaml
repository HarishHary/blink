{{- $global := .Values.global | default dict }}
{{- $logTypes := required "global.logTypes is required; pass deployments/helm/values.yaml" (get $global "logTypes") }}
{{- $logTypeOverrides := .Values.logTypeOverrides | default dict }}
{{- range $logTypeName, $_ := $logTypes }}
{{- $overrides := get $logTypeOverrides $logTypeName | default dict }}
{{- $logType := include "blink.logTypeConfig" (dict "root" $ "overrides" $overrides) | fromYaml }}
{{- $executorName := include "blink.executorName" $logTypeName }}
{{- $executorTopic := include "blink.executorTopic" $logTypeName }}
{{- $executorGroup := include "blink.executorGroup" $logTypeName }}
---
# rule-executor-{{ $logTypeName }}
# Detection engine for {{ $logTypeName }} events.
# Reads from {{ $executorTopic }}, evaluates rules tagged log_types: [{{ $logTypeName }}],
# writes fired alerts to merger-topic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $executorName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $executorName }}
    log-type: {{ $logTypeName }}
    {{- include "blink.labels" $ | nindent 4 }}
spec:
  replicas: {{ $logType.executor.replicas }}
  selector:
    matchLabels:
      app: {{ $executorName }}
  template:
    metadata:
      labels:
        app: {{ $executorName }}
        log-type: {{ $logTypeName }}
    spec:
      containers:
        - name: rule-executor
          image: {{ include "blink.image" (dict "registry" $.Values.image.registry "name" "blink-rule-executor" "tag" $.Values.image.tag) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/bin/blink-rule-executor"]
          envFrom:
            {{- include "blink.envFrom" $ | nindent 12 }}
          env:
            - name: APP_NAME
              value: {{ $executorName | quote }}
            # Executor only loads and evaluates rules tagged with this log type.
            - name: LOG_TYPE
              value: {{ $logTypeName | quote }}
            - name: KAFKA_TOPIC_EXEC
              value: {{ $executorTopic | quote }}
            - name: KAFKA_GROUP_EXEC
              value: {{ $executorGroup | quote }}
            - name: EXECUTOR_BATCH_SIZE
              value: {{ $logType.executor.batchSize | quote }}
            - name: EXECUTOR_CONCURRENCY
              value: {{ $logType.executor.concurrency | quote }}
            - name: EXECUTOR_TIMEOUT_SEC
              value: {{ $logType.executor.timeoutSec | quote }}
          ports:
            - name: http
              containerPort: 8080
          {{- include "blink.probes" $ | nindent 10 }}
          volumeMounts:
            {{- include "blink.pluginVolumeMount" $ | nindent 12 }}
          resources:
            {{- toYaml $logType.executor.resources | nindent 12 }}
      volumes:
        {{- include "blink.pluginVolume" $ | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $executorName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $executorName }}
    {{- include "blink.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $executorName }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
