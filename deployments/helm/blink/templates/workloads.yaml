{{- $stages := required "global.stages is required; pass deployments/helm/values.yaml" .Values.global.stages }}
{{- $workloads := list }}
{{- range $stageName, $_ := $stages }}
{{- $stage := include "blink.stage" (dict "root" $ "stage" $stageName) | fromYaml }}
{{- $config := include "blink.workloadConfig" (dict "root" $ "overrides" $stage.workload) | fromYaml }}
{{- $plugins := true }}
{{- if hasKey $stage.workload "plugins" }}{{- $plugins = $stage.workload.plugins }}{{- end }}
{{- $node := true }}
{{- if hasKey $stage.workload "node" }}{{- $node = $stage.workload.node }}{{- end }}
{{- $endpoints := include "blink.endpoints" (dict "root" $ "workload" $stage.workload) | fromYaml }}
{{- $workloads = append $workloads (dict "workload" $stage.workloadName "container" (default $stage.workloadName $stage.workload.container) "config" $config "plugins" $plugins "node" $node "endpoints" $endpoints.enabled) }}
{{- end }}
{{- $controller := required "global.controller is required; pass deployments/helm/values.yaml" .Values.global.controller }}
{{- $controllerWorkload := required "global.controller.workload is required" $controller.workload }}
{{- $controllerConfig := include "blink.workloadConfig" (dict "root" . "overrides" $controllerWorkload) | fromYaml }}
{{- $controllerName := required "global.controller.workload.name is required" $controllerWorkload.name }}
{{- $controllerEndpoints := include "blink.endpoints" (dict "root" $ "workload" $controllerWorkload) | fromYaml }}
{{- $workloads = append $workloads (dict "workload" $controllerName "container" (default $controllerName $controllerWorkload.container) "config" $controllerConfig "plugins" true "node" true "endpoints" $controllerEndpoints.enabled "controllerState" true) }}
{{- range $item := $workloads }}
{{- if and $item.controllerState (ne (int $item.config.replicas) 1) }}
{{- fail "the Blink controller requires exactly one replica until publication leader election is implemented" }}
{{- end }}
{{- if and (not $item.node) $item.endpoints }}
{{- fail (printf "%s sets node: false, so it has no Ergo node to serve radar, observer, or mcp from" $item.workload) }}
{{- end }}
{{- $radar := false }}
{{- range $endpoint := $item.endpoints }}{{- if eq $endpoint.name "radar" }}{{- $radar = true }}{{- end }}{{- end }}
{{- if and $item.controllerState (not $.Values.controllerState.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $item.workload }}-state
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $item.workload }}
    {{- include "blink.labels" $ | nindent 4 }}
spec:
  accessModes:
    {{- toYaml $.Values.controllerState.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $.Values.controllerState.size }}
  {{- if $.Values.controllerState.storageClassName }}
  storageClassName: {{ $.Values.controllerState.storageClassName | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $item.workload }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $item.workload }}
    {{- include "blink.labels" $ | nindent 4 }}
spec:
  replicas: {{ $item.config.replicas }}
  {{- with $item.config.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $item.workload }}
  template:
    metadata:
      labels:
        app: {{ $item.workload }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
{{ if $radar }}
        # Second scrape target on this pod: radar's per-namespace runtime series.
        blink.io/radar-port: {{ $.Values.radar.port | quote }}
{{ end }}
    spec:
      terminationGracePeriodSeconds: {{ $item.config.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $item.container }}
          image: {{ include "blink.image" (dict "registry" $.Values.image.registry "name" (printf "blink-%s" $item.container) "tag" $.Values.image.tag) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: [{{ printf "/bin/blink-%s" $item.container | quote }}]
          envFrom:
            {{- include "blink.envFrom" $ | nindent 12 }}
          env:
            - name: APP_NAME
              value: {{ $item.container | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
{{ range $endpoint := $item.endpoints }}
            - name: {{ $endpoint.name | upper }}_ENABLED
              value: "true"
            - name: {{ $endpoint.name | upper }}_HOST
              value: "0.0.0.0"
            - name: {{ $endpoint.name | upper }}_PORT
              value: {{ $endpoint.port | quote }}
{{ end }}
{{ range $name, $value := $item.config.environment }}
            - name: {{ $name | upper }}
              value: {{ $value | quote }}
{{ end }}
          ports:
            - name: http
              containerPort: 8080
{{ if $item.controllerState }}
            - name: cluster
              containerPort: {{ $.Values.cluster.port }}
{{ end }}
{{ range $endpoint := $item.endpoints }}
            - name: {{ $endpoint.name }}
              containerPort: {{ $endpoint.port }}
{{ end }}
          {{- include "blink.probes" $ | nindent 10 }}
{{ if or $item.plugins $item.controllerState }}
          volumeMounts:
{{ if $item.plugins }}
            {{- include "blink.pluginVolumeMount" $ | nindent 12 }}
{{ end }}
{{ if $item.controllerState }}
            - name: controller-state
              mountPath: {{ $.Values.controllerState.mountPath }}
{{ end }}
{{ end }}
          resources:
            {{- toYaml $item.config.resources | nindent 12 }}
{{ if or $item.plugins $item.controllerState }}
      volumes:
{{ if $item.plugins }}
        {{- include "blink.pluginVolume" $ | nindent 8 }}
{{ end }}
{{ if $item.controllerState }}
        - name: controller-state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" $item.workload) $.Values.controllerState.existingClaim }}
{{ end }}
{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $item.workload }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $item.workload }}
    {{- include "blink.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $item.workload }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{ if $item.controllerState }}
    - name: cluster
      port: {{ $.Values.cluster.port }}
      targetPort: {{ $.Values.cluster.port }}
{{ end }}
{{ range $endpoint := $item.endpoints }}
    - name: {{ $endpoint.name }}
      port: {{ $endpoint.port }}
      targetPort: {{ $endpoint.port }}
{{ end }}
{{- end }}
