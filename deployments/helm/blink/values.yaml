image:
  registry: "localhost"
  pullPolicy: Never
  tag: latest

environment: prod

kafka:
  brokers: "blink-kafka-cluster-kafka-bootstrap.kafka:9092"

# Plugin volume; swap hostPath for a ReadWriteMany PVC in production.
plugins:
  volume:
    hostPath:
      path: /blink/plugins
      type: Directory

# Controller generation and snapshot state; empty existingClaim makes the chart create the claim.
controllerState:
  mountPath: /var/lib/blink/controller
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClassName: ""

# Defaults for every workload. The CPU limit sets GOMAXPROCS, which sizes the plugin process budget: 500m caps scale-up at two extra processes. Override per stage in deployments/helm/values.yaml.
workloadDefaults:
  replicas: 1
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "1Gi"

# Auth secret; override in production via --set or an external secret manager.
auth:
  product: "blink"
  auth0Audience: "https://api.example.com"
  auth0Issuer: "https://example.auth0.com/"

# Ergo cluster networking, the only snapshot distribution path; every workload running a node joins it.
cluster:
  # Sensitive; override in production via --set or an external secret manager.
  cookie: ""
  # The controller's cluster-reachable node host: its own Service name.
  controllerNodeHost: "blink-controller"
  # Cluster acceptor port, pinned not scanned. Only the controller's Service exposes it - the one node others reach by name.
  port: 11144

# Radar: each Ergo node's /metrics and per-namespace /health/ready. Scraped only - probes stay on 8080 so one degraded namespace cannot pull a pod out of its Service.
radar:
  port: 9090

# Ergo's observer UI, per workload via `observer: true`. Off by default; ENVIRONMENT=dev enables it regardless, and adds MCP on 9922.
observer:
  port: 9911

# Grafana and the Prometheus feeding it. Targets come from the pod annotations workloads.yaml sets, so nothing is listed here. For an existing Prometheus: prometheus.enabled=false plus grafana.datasourceURL.
monitoring:
  enabled: true
  prometheus:
    enabled: true
    image: "prom/prometheus:v2.53.3"
    port: 9090
    scrapeInterval: 15s
    retention: 24h
    # Off by default: this Prometheus is for looking at a live deployment, not long-term storage.
    persistence:
      enabled: false
      size: 10Gi
      storageClassName: ""
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
  grafana:
    enabled: true
    image: "grafana/grafana:11.6.0"
    adminUser: admin
    adminPassword: admin
    anonymous: false
    datasourceURL: ""
    service:
      type: ClusterIP
      port: 3000
      nodePort: null
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Cluster node-discovery registrar: a dedicated 3-member etcd for Blink's exclusive use, not a shared one.
etcd:
  image: "quay.io/coreos/etcd:v3.5.17"
  replicas: 3
  endpoints: "blink-etcd:2379"
  username: ""
  password: ""
  storageClassName: ""
  size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
