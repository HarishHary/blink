image:
  registry: "localhost"
  pullPolicy: Never
  tag: latest

environment: prod

kafka:
  brokers: "blink-kafka-cluster-kafka-bootstrap.kafka:9092"

# Plugin volume mounted into every service pod.
# Switch to pvc for production (shared ReadWriteMany PVC).
plugins:
  volume:
    hostPath:
      path: /blink/plugins
      type: Directory

# Capacity shared by every workload, including the controller.
workloadDefaults:
  replicas: 1
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Auth Secret - override in production via --set or external secret manager.
# ---------------------------------------------------------------------------
auth:
  product: "blink"
  auth0Audience: "https://api.example.com"
  auth0Issuer: "https://example.auth0.com/"
