{{- $global := .Values.global | default dict }}
{{- $stages := required "global.stages is required; pass deployments/helm/values.yaml" (get $global "stages") }}
{{- range $stageName, $_ := $stages }}
{{- $stage := include "kafka.stage" (dict "root" $ "stage" $stageName) | fromYaml }}
{{- $overrides := get $stage "topic" | default dict }}
{{- $config := include "kafka.topic" (dict "root" $ "overrides" $overrides) | fromYaml }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $stage.topicName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.clusterName }}
spec:
  partitions: {{ $config.primary.partitions }}
  replicas: {{ $config.primary.replicas }}
  config:
    {{- toYaml $config.primary.config | nindent 4 }}
{{- if $stage.withDLQ }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $stage.dlqTopicName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.clusterName }}
spec:
  partitions: {{ $config.dlq.partitions }}
  replicas: {{ $config.dlq.replicas }}
  config:
    {{- toYaml $config.dlq.config | nindent 4 }}
{{- end }}
{{- end }}
