kafka:
  clusterName: blink-kafka-cluster
  version: 4.2.0
  metadataVersion: 4.2-IV1
  nodePool:
    name: blink-kafka-dual-role
    replicas: 1
    storage:
      size: 100Gi

# Topic defaults for every data-plane stage.
topicDefaults:
  primary:
    partitions: 6
    replicas: 1
    config:
      retention.ms: "86400000"
  dlq:
    partitions: 6
    replicas: 1
    config:
      retention.ms: "86400000"
