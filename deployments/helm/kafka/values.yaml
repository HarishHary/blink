kafka:
  clusterName: blink-kafka-cluster
  version: 4.2.0
  metadataVersion: 4.2-IV1
  nodePool:
    name: blink-kafka-dual-role
    replicas: 1
    storage:
      size: 100Gi

logTypeDefaults:
  matcher:
    partitions: 6
    replicas: 1
    config:
      retention.ms: "86400000"
  executor:
    partitions: 12
    replicas: 1
    config:
      retention.ms: "3600000"

# Enabled log types come from global.logTypes. Override topic settings per type here.
logTypeOverrides: {}

# Shared-stage topic capacity. Topology and names come from global.sharedStages.
sharedStageDefaults:
  primary:
    partitions: 6
    replicas: 1
    config:
      retention.ms: "3600000"
  dlq:
    partitions: 3
    replicas: 1
    config:
      retention.ms: "86400000"

sharedStageOverrides: {}

snapshotTopic:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
