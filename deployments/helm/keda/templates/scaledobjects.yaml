{{- $global := .Values.global | default dict }}
{{- $stages := required "global.stages is required; pass deployments/helm/values.yaml" (get $global "stages") }}
{{- range $stageName, $_ := $stages }}
{{- $stage := include "keda.stage" (dict "root" $ "stage" $stageName) | fromYaml }}
{{- $scaler := get $stage "scaler" | default dict }}
{{- if hasKey $stage "scaler" }}
{{- $config := include "keda.scalerConfig" (dict "root" $ "overrides" $scaler) | fromYaml }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ printf "%s-scaler" $stage.workloadName }}
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    name: {{ $stage.workloadName }}
  minReplicaCount: {{ $config.minReplicas }}
  maxReplicaCount: {{ $config.maxReplicas }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ $.Values.kafka.brokers }}
        consumerGroup: {{ $stage.consumerGroup }}
        topic: {{ $stage.topicName }}
        lagThreshold: {{ $config.lagThreshold | quote }}
        offsetResetPolicy: {{ $config.offsetResetPolicy }}
{{- end }}
{{- end }}
