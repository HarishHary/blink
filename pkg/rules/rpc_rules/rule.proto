syntax = "proto3";
package rules;
option go_package = "rpc_rules/;rpc_rules";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// EvaluateBatchRequest carries one encoded google.protobuf.Struct per event, not the Struct itself. A
// bytes field and a submessage field share proto's length-delimited encoding, so this is the same wire
// format the field had when it was declared as repeated google.protobuf.Struct and either side of the
// handshake may predate the change. Bytes are what let the executor reuse the encoding the exec record
// already carried for every rule that evaluates the event, instead of encoding once per rule.
message EvaluateBatchRequest { repeated bytes events = 1; }

// EvaluateItem carries the match outcome, optional per-event overrides, and item error.
// Empty string / nil fields mean "use YAML default".
message EvaluateItem {
  bool                   matched       = 1;
  string                 title         = 2;
  string                 description   = 3;
  string                 severity      = 4; // "info|low|medium|high|critical"; "" = YAML default
  google.protobuf.Struct context       = 5; // per-event context map; nil = YAML default
  repeated string        merge_by_keys = 6; // empty = use YAML merge_by_keys
  string                 error         = 7;
}

message EvaluateBatchResponse {
  repeated EvaluateItem items = 1;
}

service Rule {
  rpc EvaluateBatch(EvaluateBatchRequest) returns (EvaluateBatchResponse);
  rpc Init(google.protobuf.Empty)         returns (google.protobuf.Empty);
  rpc Shutdown(google.protobuf.Empty)     returns (google.protobuf.Empty);
  rpc Ping(google.protobuf.Empty)         returns (google.protobuf.Empty);
}
