syntax = "proto3";
package enrichments;
option go_package = "rpc_enrichments/;rpc_enrichments";

import "google/protobuf/empty.proto";
import "pkg/alerts/pb/alert.proto";

message EnrichBatchRequest  { repeated alerts.Alert alerts = 1; } // structured alerts.Alert per alert

message EnrichBatchResponse {
  repeated bytes result_json = 1;
  repeated string errors = 2;
}

service Enrichment {
  rpc EnrichBatch(EnrichBatchRequest) returns (EnrichBatchResponse);
  rpc Init(google.protobuf.Empty)     returns (google.protobuf.Empty);
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Ping(google.protobuf.Empty)     returns (google.protobuf.Empty);
}
