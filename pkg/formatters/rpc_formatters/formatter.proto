syntax = "proto3";
package formatters;
option go_package = "rpc_formatters/;rpc_formatters";

import "google/protobuf/empty.proto";
import "pkg/alerts/pb/alert.proto";

message FormatBatchRequest  { repeated alerts.Alert alerts = 1; } // structured alerts.Alert per alert

message FormatBatchResponse {
  repeated bytes result_json = 1; // one JSON-encoded map[string]any per alert
  repeated string errors = 2; // one item error string per alert
}

service Formatter {
  rpc FormatBatch(FormatBatchRequest) returns (FormatBatchResponse);
  rpc Init(google.protobuf.Empty)     returns (google.protobuf.Empty);
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Ping(google.protobuf.Empty)     returns (google.protobuf.Empty);
}
