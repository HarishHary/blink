syntax = "proto3";
package tuning_rules;
option go_package = "rpc_tuning_rules/;rpc_tuning_rules";

import "google/protobuf/empty.proto";
import "pkg/alerts/pb/alert.proto";

message TuneBatchRequest  { repeated alerts.Alert alerts = 1; } // structured alerts.Alert per alert

message TuneBatchResponse { repeated bool applies = 1; } // one result per alert

service TuningRule {
  rpc TuneBatch(TuneBatchRequest)     returns (TuneBatchResponse);
  rpc Init(google.protobuf.Empty)     returns (google.protobuf.Empty);
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Ping(google.protobuf.Empty)     returns (google.protobuf.Empty);
}
