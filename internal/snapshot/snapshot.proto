syntax = "proto3";
package snapshot;

option go_package = "pb/;pb";

// EffectiveEntry is the wire form of internal/snapshot.EffectiveEntry: the desired state for
// one logical plugin ID. The snapshot topic is per-ID keyed, so each entry is a standalone
// message (there is no aggregate Snapshot on the wire) - (de)serialise with snapshot.Marshal /
// snapshot.Unmarshal.
message EffectiveEntry {
  string      id        = 1;
  bool        enabled   = 2;
  ArtifactRef primary   = 3;    // blue-green (stable) artifact; unset if none yet
  ArtifactRef candidate = 4;  // canary/shadow artifact; unset if BG-only
  reserved 5;                 // was: bytes spec (moved onto ArtifactRef so candidates carry their own)
}

// ArtifactRef names one binary artifact, its rollout mode, and its config.
message ArtifactRef {
  string      name = 1;
  RolloutMode mode = 2;
  bytes       spec = 3;  // yaml-marshaled metadata for THIS artifact (lets consumers route/configure off the snapshot alone)
  string      hash = 4;  // sha256 (hex) of the artifact binary the controller saw; empty if none present
}

// RolloutMode mirrors internal/pools.RolloutMode (iota order: blue-green, canary, shadow).
enum RolloutMode {
  ROLLOUT_MODE_BLUE_GREEN = 0;
  ROLLOUT_MODE_CANARY     = 1;
  ROLLOUT_MODE_SHADOW     = 2;
}
